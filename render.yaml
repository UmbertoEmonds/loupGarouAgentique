# Déploiement Render (offre gratuite). UN SEUL process / une seule instance :
# l'état de la partie vit en mémoire et la couche Channels est InMemory.
services:
  - type: web
    name: loups-garous
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py tailwind build
      && python manage.py collectstatic --noinput
      && python manage.py migrate --noinput
      && python manage.py ensure_admin
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loups-garous-db
          property: connectionString
      # Compte de l'admin Django (/admin/), créé au build s'il n'existe pas encore.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false   # à renseigner dans le dashboard Render
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # à renseigner dans le dashboard Render
      - key: OPENROUTER_API_KEY
        sync: false   # à renseigner dans le dashboard Render
      - key: OPENROUTER_MODELS
        value: google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,openrouter/free
      - key: GROQ_API_KEY
        sync: false   # à renseigner dans le dashboard Render ; vide = repli désactivé
      - key: GROQ_MODELS
        value: llama-3.1-8b-instant

# PostgreSQL : suivi des coûts en jetons par manche (app monitoring).
# Attention : la base gratuite de Render expire 30 jours après sa création.
databases:
  - name: loups-garous-db
    plan: free
    databaseName: loups_garous
    user: loups_garous
